      - type: image
        title: ""
        clue: ""
        photos: content/photos/mechanical-block/q1
      - type: flag
        title: ""
        note: ""
        link: ""
        flag: "GDG{}"
      - type: flag
        title: ""
        note: ""
        link: ""
        flag: "GDG{}"
    location_code: "GDG{}"
    next_clue: ""
    lat: 25.13200
    lng: 55.41950

  - id: library
    place: "Library"
