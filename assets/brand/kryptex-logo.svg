<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Kryptex Quest logo: a faceless hooded figure with a glowing code bracket face">
  <defs>
    <radialGradient id="back" cx="50%" cy="42%" r="55%"><stop offset="0" stop-color="#3b3e48"/><stop offset=".55" stop-color="#14151a"/><stop offset="1" stop-color="#050507"/></radialGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34363f"/><stop offset=".45" stop-color="#17181d"/><stop offset="1" stop-color="#0a0a0d"/></linearGradient>
    <linearGradient id="cloak" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#202228"/><stop offset="1" stop-color="#08080a"/></linearGradient>
    <radialGradient id="void" cx="50%" cy="48%" r="60%"><stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#0b0c10"/></radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9"/></filter>
    <clipPath id="badge"><circle cx="256" cy="256" r="240"/></clipPath>
  </defs>
  <circle cx="256" cy="256" r="252" fill="#050507"/>
  <circle cx="256" cy="256" r="240" fill="url(#back)"/>
  <g clip-path="url(#badge)">
    <!-- faint grid, like the poster -->
    <g stroke="#ffffff" stroke-opacity=".05" stroke-width="2"><path d="M60 120h392M60 170h392M60 220h392M60 270h392M60 320h392M120 40v432M170 40v432M342 40v432M392 40v432"/></g>
    <!-- cloak: the hood drapes straight into the shoulders -->
    <path d="M256 22C196 30 150 92 140 176c-6 52-30 92-72 126C34 330 12 410 6 520h500c-6-110-28-190-62-218-42-34-66-74-72-126C362 92 316 30 256 22z" fill="url(#hood)" stroke="#3d404b" stroke-width="4" stroke-linejoin="round"/>
    <!-- fabric folds -->
    <g fill="none" stroke-linecap="round" stroke-width="5">
      <path d="M196 56c-34 34-52 80-54 132" stroke="#4d515e" stroke-opacity=".6"/>
      <path d="M316 56c34 34 52 80 54 132" stroke="#4d515e" stroke-opacity=".4"/>
      <path d="M150 300c-30 40-50 120-52 220" stroke="#2f323b"/><path d="M362 300c30 40 50 120 52 220" stroke="#2f323b"/>
      <path d="M200 340c-18 50-22 120-18 180" stroke="#262830"/><path d="M312 340c18 50 22 120 18 180" stroke="#262830"/>
      <path d="M232 372c-6 50-6 100-2 148" stroke="#1e2026"/><path d="M280 372c6 50 6 100 2 148" stroke="#1e2026"/>
    </g>
    <!-- hood opening: a tall dark void -->
    <path d="M256 78c-50 8-82 56-82 118 0 40 14 74 34 98 14 16 32 26 48 26s34-10 48-26c20-24 34-58 34-98 0-62-32-110-82-118z" fill="url(#void)" stroke="#1b1c22" stroke-width="8" stroke-linejoin="round"/>
    <path d="M182 188c8-52 38-90 74-96" fill="none" stroke="#000" stroke-opacity=".6" stroke-width="10" stroke-linecap="round"/>
    <!-- chest drape line -->
    <path d="M196 318c20 24 100 24 120 0" fill="none" stroke="#3a3d47" stroke-width="5" stroke-linecap="round"/>
    <!-- glowing < > -->
    <g fill="none" stroke="#35d6ff" stroke-width="18" stroke-linejoin="miter" filter="url(#glow)" opacity=".9"><path d="M238 190l-32 32 32 32"/><path d="M274 190l32 32-32 32"/></g>
    <g fill="none" stroke="#d6fbff" stroke-width="13" stroke-linejoin="miter" stroke-linecap="butt"><path d="M238 190l-32 32 32 32"/><path d="M274 190l32 32-32 32"/></g>
  </g>
  <!-- ring with the four GDG colours at the compass points -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="#2f323b" stroke-width="6"/>
  <g stroke="#050507" stroke-width="4"><circle cx="256" cy="16" r="11" fill="#4285f4"/><circle cx="496" cy="256" r="11" fill="#34a853"/><circle cx="256" cy="496" r="11" fill="#fbbc04"/><circle cx="16" cy="256" r="11" fill="#ea4335"/></g>
</svg>
