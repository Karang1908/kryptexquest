<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#05070b" />
    <title>Kryptex Quest · Live</title>
    <link rel="icon" type="image/png" href="../assets/brand/favicon.png" />
    <link rel="preload" href="../assets/fonts/GoogleSans.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="../theme.css" />
    <style>
      body { overflow: auto; min-height: 100vh; background: #150a36 url('../assets/art/keyart-night.svg') center bottom / cover fixed no-repeat; }
      body::before { content: ''; position: fixed; inset: 0; background: rgba(14, 7, 38, 0.62); pointer-events: none; }
      .wrap { position: relative; max-width: 1280px; margin: 0 auto; padding: 4vh 4vw 6vh; display: grid; gap: 3vh; }
      header { display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
      header img { height: clamp(40px, 6vw, 84px); width: auto; filter: drop-shadow(0 3px 0 rgba(0, 0, 0, 0.5)); }
      #state { display: inline-flex; align-items: center; gap: 12px; font: 400 clamp(18px, 2.4vw, 34px) var(--font-display); letter-spacing: 0.05em; text-transform: uppercase; padding: 8px 26px; border-radius: 999px; border: 4px solid var(--ink); background: var(--recess); box-shadow: inset 0 4px 8px rgba(0, 0, 0, 0.6), 0 4px 0 var(--ink); color: var(--muted); }
      #state::before { content: ''; width: 0.5em; height: 0.5em; border-radius: 50%; background: currentColor; border: 3px solid var(--ink); box-sizing: content-box; }
      #state.running { color: var(--green-ink); } #state.paused, #state.lobby { color: var(--yellow-ink); } #state.ended { color: var(--red-ink); }
      #state:empty { display: none; }
      h1 { font-size: clamp(44px, 8vw, 110px); line-height: 0.95; color: #fff; -webkit-text-stroke: 8px var(--ink); paint-order: stroke fill; text-shadow: 0 6px 0 var(--ink); }
      h1 span { color: var(--yellow-hi); }
      #rows { display: grid; gap: 1.6vh; }
      .row { position: relative; display: grid; grid-template-columns: 7vw 1fr 20vw; gap: 2vw; align-items: center; padding: 2vh 2.4vw; border-radius: 26px; border: 4px solid var(--ink); background: linear-gradient(180deg, #3d2d94, #291d6c); box-shadow: 0 6px 0 var(--ink), inset 0 4px 0 rgba(255, 255, 255, 0.16); font-size: clamp(16px, 2.4vw, 34px); }
      .row:nth-child(1) { border-color: var(--yellow); }
      .row .pos { display: grid; place-items: center; width: 1.9em; height: 1.9em; border-radius: 50%; border: 4px solid var(--ink); background: var(--locked-lo); font: 400 1em var(--font-display); font-variant-numeric: tabular-nums; }
      .row:nth-child(1) .pos { background: linear-gradient(180deg, var(--yellow-hi), var(--yellow-lo)); color: #3a2200; }
      .row:nth-child(2) .pos { background: linear-gradient(180deg, #e8ecff, #9aa5d6); color: #1b2140; }
      .row:nth-child(3) .pos { background: linear-gradient(180deg, #f0a56a, #b5622a); color: #3a1c08; }
      .row strong { display: block; font-family: var(--font-display); font-weight: 400; letter-spacing: 0.01em; }
      .row small { display: block; color: var(--muted); font-size: 0.5em; margin-top: 0.2em; }
      .pips { display: flex; gap: 6px; margin-top: 1.2vh; }
      .pips i { flex: 1; height: 14px; border-radius: 7px; border: 3px solid var(--ink); background: var(--recess); box-sizing: border-box; }
      .pips i.on { background: linear-gradient(180deg, var(--green-hi), var(--green-lo)); } .pips i.hub { background: linear-gradient(180deg, var(--yellow-hi), var(--yellow-lo)); }
      .time { text-align: right; font: 400 1.15em var(--font-display); font-variant-numeric: tabular-nums; }
      #note { text-align: center; color: #ebe4ff; font-size: 22px; padding: 12vh 0; text-shadow: 0 2px 0 #000; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header><img src="../assets/brand/gdg-logo-dark.png" alt="Google Developer Group, BITS Pilani Dubai Campus" /><div id="state"></div></header>
      <h1>Kryptex <span>Quest</span></h1>
      <div id="rows"></div>
      <p id="note" hidden></p>
    </div>
    <script type="module" src="./board.js"></script>
  </body>
</html>
